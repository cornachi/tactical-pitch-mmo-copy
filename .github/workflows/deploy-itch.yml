name: Deploy to itch.io

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to itch.io via Butler
        uses: josephbmanley/build-and-deploy-itchio@v1.0.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.ITCH_BUTLER_API_KEY }}
          ITCH_GAME: tactical-pitch
          ITCH_USER: cornachi
          PACKAGE: ./dist
          CHANNEL: html5
