name: Deploy to itch.io

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Push to itch.io
        uses: fire-eggs/itchio-deploy@v1.0.2
        with:
          beke: ${{ secrets.ITCH_BUTLER_API_KEY }}
          user: cornachi
          game: tactical-pitch
          folder: ./dist
          channel: html5
