name: Deploy to itch.io via Butler

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Upload to itch.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Deploy to itch.io
        uses: manikandanraji/itch-publish-action@v2.0.1
        with:
          butler_api_key: ${{ secrets.BUTLER_CREDENTIALS }}
          game_path: 'dist'
          user: 'cornachi'
          game_id: 'tactical-pitch'
          channel: 'html5'
