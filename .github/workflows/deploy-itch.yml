name: Deploy to itch.io

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to itch.io via Official Butler Action
        uses: itchio/butler-deploy-action@v1.3.0
        with:
          api-key: ${{ secrets.ITCH_BUTLER_API_KEY }}
          user: cornachi
          game: tactical-pitch
          channel: html5
          package: ./dist
