name: Deploy to itch.io via Butler

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Upload to itch.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Deploy to itch.io via Butler
        uses: josephbmanley/build-itchio-action@v1.0.0
        with:
          package: 'dist'
          itch_username: 'cornachi' # Confirme seu usuário do itch.io
          game_name: 'tactical-pitch' # Confirme o slug do jogo no itch.io
          version: ${{ github.sha }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
