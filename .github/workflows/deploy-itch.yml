name: Deploy to itch.io

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install Butler
        run: |
          curl -L -o butler.zip https://github.com/itchio/butler/releases/latest/download/butler-linux-amd64.zip
          unzip butler.zip
          chmod +x ./linux-amd64/butler
          ./linux-amd64/butler -V

      - name: Deploy to itch.io via Butler
        run: |
          BUTLER_API_KEY="${{ secrets.BUTLER_CREDENTIALS }}" ./linux-amd64/butler push ./dist cornachi/tactical-pitch:html5
